[package]
name = "kincaid-label-generator"
version = "2.2.1"
edition = "2024"
authors = ["Adam Kincaid"]
description = "Kincaid Label Generator - makes Build-To label sheets as PDF"
build = "build.rs"

[dependencies]
csv = "1.4.0"
egui_extras = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
miniz_oxide = "0.8"
pdf-writer = "0.15.0"
quick-xml = "0.42.0"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subsetter = "0.2.6"
ttf-parser = "0.25.1"
winit = "0.30"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

# OpenGL renderer everywhere (works on older PCs and in virtual machines)
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }

# On a Mac use Apple's Metal graphics
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
# `--cfg wincheck` type-checks the Windows printing code on other systems
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(wincheck)"] }
